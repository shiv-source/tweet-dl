# Release workflow — triggered by pushing a version tag.
#
# Usage:
#   pnpm version patch        # 0.1.0 → 0.1.1  (bug fixes)
#   pnpm version minor        # 0.1.0 → 0.2.0  (new features)
#   pnpm version major        # 0.1.0 → 1.0.0  (breaking changes)
#
#   pnpm version prerelease --preid=rc   # 1.0.0 → 1.0.1-rc.0
#   pnpm version prerelease --preid=alpha # 1.0.0 → 1.0.1-alpha.0
#
#   git push --follow-tags
#
# Tag → npm dist-tag mapping:
#   v1.0.0            → latest   (npm install tweet-dl)
#   v1.0.1-rc.0       → rc       (npm install tweet-dl@rc)
#   v1.0.0-alpha.0    → alpha    (npm install tweet-dl@alpha)
#   v1.0.0-beta.1     → beta     (npm install tweet-dl@beta)
#
# Setup: add an NPM_TOKEN secret in GitHub repo Settings → Secrets.

name: Release

on:
  push:
    tags:
      # SemVer: major.minor.patch with optional -prerelease suffix
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # ── Verify ──────────────────────────────────────────────
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  # ── Build ───────────────────────────────────────────────
  build:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package
        run: pnpm pack

      - uses: actions/upload-artifact@v4
        with:
          name: package
          retention-days: 1
          path: tweet-dl-*.tgz

  # ── Release ─────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tweet-dl-*.tgz
          generate_release_notes: true
          prerelease: auto

  # ── Publish ──────────────────────────────────────────────
  publish:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Detect npm tag
        id: npm_tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRETAG="${VERSION#*-}"
            PRETAG="${PRETAG%%.*}"
            echo "tag=$PRETAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: |
          mkdir -p /tmp/pkg
          tar xf tweet-dl-*.tgz --strip-components=1 -C /tmp/pkg
          cd /tmp/pkg
          pnpm publish --tag "${{ steps.npm_tag.outputs.tag }}" --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
